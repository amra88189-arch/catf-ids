<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CATF-IDS — SOC Console (Live Demo)</title>
<meta name="description" content="CATF-IDS live demo — a SOC console monitoring the TON_IoT device fleet with fused, explainable verdicts.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.29.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#0a0f18; --panel:#131c2b; --panel2:#0d1420; --line:#1e2a3d;
  --txt:#e8eef7; --mut:#5d7290; --dim:#8fa3bd;
  --amber:#f0a63a; --cyan:#22d3ee; --green:#4ad6a0; --red:#e0564a; --blue:#7fb4e8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh}
a{color:var(--blue);text-decoration:none}
.mono{font-family:'Cascadia Code','Consolas',monospace}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:10}
.crumb{font-size:13px;color:var(--mut)}
.crumb a{color:var(--blue)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand span{font-size:16px;font-weight:600;letter-spacing:1px}
@keyframes lookAround{0%,18%{transform:translateX(0)}26%,40%{transform:translateX(-6px)}48%,66%{transform:translateX(6px)}74%,100%{transform:translateX(0)}}
@keyframes blinkLid{0%,90%,100%{transform:scaleY(0)}93%,96%{transform:scaleY(1)}}
.eyeball{animation:lookAround 6s ease-in-out infinite}
.eyelid{transform-origin:50% 0;animation:blinkLid 6s linear infinite}
main{max-width:1180px;margin:0 auto;padding:20px 24px 60px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .lbl{font-size:11px;color:var(--mut);letter-spacing:.5px}
.card .val{font-size:22px;font-weight:600;margin-top:4px}
.card .sub{font-size:11px;color:var(--mut);margin-top:4px}
.sect{font-size:11px;color:var(--mut);letter-spacing:1.5px;margin:22px 0 10px}
.fleet{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.dev{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 8px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s}
.dev:hover{transform:translateY(-3px);border-color:var(--blue)}
.dev i{font-size:30px}
.dev .nm{font-size:13px;margin-top:8px;color:var(--txt)}
.dev .st{font-size:11px;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.panel h3{font-size:11px;color:var(--mut);letter-spacing:1.5px;font-weight:600;margin-bottom:10px}
.feed .al{border-left:3px solid var(--amber);padding:6px 10px;margin-bottom:8px;background:rgba(240,166,58,.04)}
.feed .al.hi{border-color:var(--red);background:rgba(224,86,74,.05)}
.feed .al .t1{font-size:13px}
.feed .al .t2{font-size:11px;color:var(--mut);margin-top:2px}
.devhead{display:flex;align-items:center;gap:16px;margin:6px 0 18px;flex-wrap:wrap}
.devicon{width:64px;height:64px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.devicon i{font-size:34px}
.devhead .nm{font-size:20px;font-weight:600}
.devhead .ip{font-size:12px;color:var(--mut);margin-top:2px}
.badge{margin-left:auto;font-size:13px;padding:5px 14px;border-radius:14px;border:1px solid}
.btn{flex:1;font-size:14px;padding:12px 10px;border-radius:9px;cursor:pointer;background:transparent;font-family:inherit;transition:filter .15s}
.btn:hover{filter:brightness(1.25)}
.btn.ctl{border:1px solid var(--blue);color:var(--blue);background:rgba(127,180,232,.07)}
.btn.stp{border:1px solid var(--red);color:var(--red);background:rgba(224,86,74,.08);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:4px 2px;text-align:left}
th{color:var(--mut);font-weight:400;font-size:11px}
.num{text-align:right}
.logbox{font-size:12px;line-height:2;max-height:340px;overflow-y:auto}
.chip{font-size:11px;padding:3px 12px;border-radius:12px;background:var(--line);color:var(--blue);cursor:pointer;border:none;font-family:inherit}
.chip.on{background:#243447;color:var(--txt)}
.bar{height:7px;border-radius:4px;display:inline-block;vertical-align:middle}
.ok{color:var(--green)}.wr{color:var(--amber)}.er{color:var(--red)}.mu{color:var(--mut)}
.notice{border:1px solid var(--blue);background:rgba(127,180,232,.08);color:var(--blue);border-radius:9px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
.notice.stop{border-color:var(--red);background:rgba(224,86,74,.08);color:var(--red)}
footer{border-top:1px solid var(--line);padding:16px 24px;text-align:center;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <div class="crumb" id="crumb"><a href="index.html">catf-ids.site</a> / SOC console</div>
  <div class="brand" onclick="location.hash=''">
    <span>CATF-IDS</span>
    <svg width="52" height="30" viewBox="0 0 92 52" aria-label="CATF-IDS logo">
      <path d="M4,30 Q30,4 60,10 Q80,14 89,26 Q70,20 58,20 Q30,18 4,30 Z" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
      <path d="M6,32 Q30,46 58,42 Q76,39 88,28 Q66,44 40,40 Q20,37 6,32 Z" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <g class="eyeball">
        <circle cx="46" cy="29" r="10" fill="#f0a63a"/>
        <circle cx="46" cy="29" r="4.5" fill="#1a1208"/>
        <circle cx="49" cy="26" r="1.6" fill="#fff"/>
      </g>
      <rect class="eyelid" x="24" y="14" width="44" height="30" rx="14" fill="#0d1420"/>
    </svg>
  </div>
</header>
<main id="app"></main>
<footer>CATF-IDS demo — simulated replay of TON_IoT telemetry · Graduation Project, Faculty of Computers &amp; AI, Cairo University · <a href="index.html">back to site</a></footer>

<script>
const ICONS={fridge:'ti-fridge',garage:'ti-door',gps:'ti-gps',modbus:'ti-cpu',light:'ti-bulb',thermostat:'ti-temperature',weather:'ti-cloud'};
const now=()=>new Date().toLocaleTimeString('en-GB');
function rnd(a,b,d=1){return +(a+Math.random()*(b-a)).toFixed(d)}

const D={
 fridge:{name:'Smart fridge',ip:'192.168.1.40',proto:'mqtt',status:'alert',risk:.84,trust:.55,
  tel:()=>({fridge_temperature:S.fridge.attack? rnd(-13,-11):rnd(3.5,4.5),temp_condition:S.fridge.attack?'high':'normal'}),
  expected:'1.0 – 6.5 °C',
  explain:{text:'Temperature dropped to −12.1 °C — physically implausible for this unit — while two outbound flows to an unknown host appeared. Pattern matches a spoofed-telemetry campaign (Behavioral Memory cluster #12).',
   feats:[['temp_implausible',.41,'red'],['conn_state_S0',.27,'amber'],['mqtt_reconnects',.16,'amber']]},
  net:[['192.168.1.190:1883','mqtt','SF','2.1k','ok'],['192.168.1.30:1883','mqtt','SF','1.8k','ok'],['45.33.9.12:6667','tcp','S0','640','flagged'],['45.33.9.12:6667','tcp','REJ','320','flagged'],['192.168.1.1:53','dns','SF','180','ok']]},
 garage:{name:'Garage door',ip:'192.168.1.41',proto:'mqtt',status:'normal',risk:.12,trust:.93,
  tel:()=>({door_state:Math.random()>.9?'open':'closed',sphone_signal:rnd(-71,-64,0)+' dBm'}),
  expected:'closed outside work hours',
  explain:{text:'No active alert. Door state transitions match the site schedule; signal strength stable.',feats:[['schedule_match',.05,'green'],['signal_stable',.04,'green']]},
  net:[['192.168.1.190:1883','mqtt','SF','1.2k','ok'],['192.168.1.1:53','dns','SF','120','ok']]},
 gps:{name:'GPS tracker',ip:'192.168.1.42',proto:'mqtt',status:'watch',risk:.66,trust:.78,
  tel:()=>({latitude:(30.028+Math.random()*.004).toFixed(5),longitude:(31.208+Math.random()*.004).toFixed(5)}),
  expected:'inside site geofence',
  explain:{text:'Repeated inbound connection attempts on a backdoor port were rejected. Position remains inside the geofence — device on elevated watch, threshold tightened by the Contextual Engine.',
   feats:[['backdoor_attempts',.33,'amber'],['rej_conn_ratio',.21,'amber'],['geo_ok',-.10,'green']]},
  net:[['192.168.1.190:1883','mqtt','SF','950','ok'],['102.44.7.8:5555','tcp','REJ','410','flagged'],['102.44.7.8:5555','tcp','REJ','380','flagged']]},
 modbus:{name:'Modbus unit',ip:'192.168.1.43',proto:'modbus/tcp',status:'normal',risk:.18,trust:.9,
  tel:()=>({FC1_read_coil:rnd(0,1,0),FC2_discrete:rnd(0,1,0),FC3_holding:rnd(31200,31600,0),FC4_input:rnd(11800,12400,0)}),
  expected:'register values in band',
  explain:{text:'No active alert. Register reads within the learned operating band; polling cadence normal.',feats:[['reg_in_band',.06,'green'],['cadence_ok',.03,'green']]},
  net:[['192.168.1.152:502','modbus','SF','3.4k','ok'],['192.168.1.30:502','modbus','SF','2.9k','ok']]},
 light:{name:'Motion light',ip:'192.168.1.44',proto:'mqtt',status:'normal',risk:.09,trust:.95,
  tel:()=>({motion_status:Math.random()>.7?'detected':'clear',light_status:Math.random()>.5?'on':'off'}),
  expected:'motion→light correlation',
  explain:{text:'No active alert. Light toggles correlate with motion events as expected.',feats:[['correlation_ok',.04,'green']]},
  net:[['192.168.1.190:1883','mqtt','SF','800','ok']]},
 thermostat:{name:'Thermostat',ip:'192.168.1.45',proto:'mqtt',status:'normal',risk:.14,trust:.92,
  tel:()=>({current_temperature:rnd(21.5,23.5),thermostat_status:'on'}),
  expected:'20 – 26 °C',
  explain:{text:'No active alert. Room temperature tracking setpoint; duty cycle nominal.',feats:[['temp_in_band',.05,'green']]},
  net:[['192.168.1.190:1883','mqtt','SF','1.1k','ok'],['192.168.1.1:53','dns','SF','90','ok']]},
 weather:{name:'Weather station',ip:'192.168.1.46',proto:'mqtt',status:'normal',risk:.11,trust:.94,
  tel:()=>({temperature:rnd(28,31),pressure:rnd(1008,1012,0)+' hPa',humidity:rnd(38,46,0)+' %'}),
  expected:'sensor drift < 2%',
  explain:{text:'No active alert. Readings consistent with the co-located reference sensor.',feats:[['drift_ok',.03,'green']]},
  net:[['192.168.1.190:1883','mqtt','SF','1.6k','ok']]}
};

const S={};
for(const k in D){S[k]={attack:D[k].status==='alert',stopped:false,manual:false,hist:[],logs:[]}}
S.fridge.attack=true;

function seedLogs(){
 const t=(m)=>{const d=new Date(Date.now()-m*60000);return d.toLocaleTimeString('en-GB')};
 S.fridge.logs=[
  [t(0),'er','ANOMALY','telemetry temp=−12.1 flagged by Behavioral Physics · risk 0.84'],
  [t(1),'er','ALERT','outbound tcp 45.33.9.12:6667 state S0 · Fusion risk 0.79'],
  [t(2),'ok','OK','telemetry temp=3.9 cond=normal'],
  [t(3),'wr','WARN','mqtt broker reconnect ×3 in 40s · trust weight lowered to 0.55'],
  [t(5),'wr','WARN','login attempt from 192.168.1.152 failed (ssh)'],
  [t(6),'ok','OK','telemetry temp=4.0 cond=normal'],
  [t(8),'ok','OK','telemetry temp=4.2 cond=normal']];
 S.gps.logs=[
  [t(1),'wr','WARN','inbound tcp 102.44.7.8:5555 rejected ×4 · watch raised'],
  [t(3),'ok','OK','position update inside geofence'],
  [t(6),'ok','OK','position update inside geofence']];
 for(const k of ['garage','modbus','light','thermostat','weather']){
  S[k].logs=[[t(1),'ok','OK','telemetry nominal'],[t(4),'ok','OK','telemetry nominal'],[t(8),'ok','OK','heartbeat received']]}
}
seedLogs();

const FEED=[
 ['er','Fridge — temp telemetry outside physical range','Behavioral Physics · risk 0.84','fridge'],
 ['wr','GPS — repeated backdoor connection attempts','Fusion Classifier · risk 0.66','gps'],
 ['wr','Fleet — multi-stage pattern matches campaign #12','Behavioral Memory · risk 0.61','fridge']];

function stColor(s){return s==='alert'?'var(--red)':s==='watch'?'var(--amber)':s==='stopped'?'var(--mut)':s==='manual'?'var(--blue)':'var(--green)'}
function stText(s){return s==='alert'?'alert':s==='watch'?'watch':s==='stopped'?'STOPPED':s==='manual'?'manual ctrl':'normal'}
function devStatus(k){if(S[k].stopped)return 'stopped';if(S[k].manual)return 'manual';return D[k].status}

function fsm(){const r=fusedRisk();return r>.75?['Elevated','var(--red)']:r>.45?['Suspicious','var(--amber)']:['Safe','var(--green)']}
function fusedRisk(){let m=0;for(const k in D){if(!S[k].stopped)m=Math.max(m,D[k].risk)}return +( (m*.8+.05)).toFixed(2)}
function alertCount(){let h=0,md=0;for(const k in D){const s=devStatus(k);if(s==='alert')h++;else if(s==='watch')md++}return[h,md]}

function overview(){
 const [f,fc]=fsm();const [hi,md]=alertCount();
 let tiles='';
 for(const k in D){const s=devStatus(k);const c=stColor(s);
  tiles+=`<div class="dev" style="border-color:${s==='normal'?'var(--line)':c}" onclick="location.hash='#/${k}'">
   <i class="ti ${ICONS[k]}" style="color:${c}"></i><div class="nm">${D[k].name}</div><div class="st" style="color:${c}">● ${stText(s)}</div></div>`}
 let feed='';
 for(const [lv,t1,t2,dev] of FEED){feed+=`<div class="al ${lv==='er'?'hi':''}"><div class="t1">${t1}</div><div class="t2 mono">${t2} · <a href="#/${dev}">open device</a></div></div>`}
 const on=Object.keys(D).filter(k=>!S[k].stopped).length;
 document.getElementById('crumb').innerHTML='<a href="index.html">catf-ids.site</a> / SOC console';
 document.getElementById('app').innerHTML=`
 <div class="cards">
  <div class="card"><div class="lbl">SYSTEM STATE (FSM)</div><div class="val" style="color:${fc}">${f}</div><div class="sub">Safe → Suspicious → Elevated → Critical</div></div>
  <div class="card"><div class="lbl">FUSED RISK SCORE</div><div class="val">${fusedRisk()}</div><div class="sub">adaptive threshold 0.71</div></div>
  <div class="card"><div class="lbl">ACTIVE ALERTS</div><div class="val" style="color:${hi?'var(--red)':'var(--green)'}">${hi+md}</div><div class="sub">${hi} high · ${md} medium</div></div>
  <div class="card"><div class="lbl">DEVICES ONLINE</div><div class="val" style="color:${on===7?'var(--green)':'var(--amber)'}">${on} / 7</div><div class="sub">TON_IoT fleet</div></div>
 </div>
 <div class="sect">DEVICE FLEET — CLICK A DEVICE TO OPEN ITS PAGE</div>
 <div class="fleet">${tiles}</div>
 <div class="sect">LIVE ALERT FEED</div>
 <div class="panel feed">${feed}</div>`;
}

let logFilter='all';
function device(k){
 const d=D[k],s=S[k],st=devStatus(k),c=stColor(st);
 const tel=s.stopped?null:d.tel();
 if(tel && !s.stopped){s.hist.push(Object.values(tel)[0]);if(s.hist.length>40)s.hist.shift()}
 document.getElementById('crumb').innerHTML=`<a href="#" onclick="location.hash='';return false">Fleet</a> / ${d.name}`;
 let telRows='';
 if(tel){for(const f in tel){const bad=(k==='fridge'&&s.attack&&(f==='fridge_temperature'||f==='temp_condition'));
   telRows+=`<tr><td class="mu">${f}</td><td class="num mono ${bad?'er':''}">${tel[f]}</td></tr>`}
  telRows+=`<tr><td class="mu">expected</td><td class="num mono mu">${d.expected}</td></tr>`;
  telRows+=`<tr><td class="mu">physics check</td><td class="num mono ${k==='fridge'&&s.attack?'er':'ok'}">${k==='fridge'&&s.attack?'implausible':'plausible'}</td></tr>`}
 else{telRows='<tr><td class="mu">device quarantined — no telemetry</td></tr>'}
 let spark='';
 if(s.hist.length>1){const h=s.hist.map(Number).filter(n=>!isNaN(n));
  if(h.length>1){const mn=Math.min(...h),mx=Math.max(...h),rg=(mx-mn)||1;
   const pts=h.map((v,i)=>`${(i/(h.length-1)*260).toFixed(0)},${(38-((v-mn)/rg)*34).toFixed(0)}`).join(' ');
   spark=`<div style="margin-top:10px"><div style="font-size:10px;color:var(--mut);margin-bottom:4px">first metric — recent readings</div>
   <svg width="100%" height="42" viewBox="0 0 260 42" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="2"/></svg></div>`}}
 let netRows='';
 for(const [dst,pr,cs,by,v] of d.net){netRows+=`<tr class="mono" style="color:var(--dim)"><td>${dst}</td><td>${pr}</td><td>${cs}</td><td class="num">${by}</td><td class="num ${v==='ok'?'ok':'er'}">${v}</td></tr>`}
 let feats='';
 for(const [f,w,cl] of d.explain.feats){const col=cl==='red'?'var(--red)':cl==='amber'?'var(--amber)':'var(--green)';
  feats+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px" class="mono" >
   <span class="mu" style="width:140px;font-size:11px">${f}</span>
   <span class="bar" style="width:${Math.abs(w)*300}px;background:${col}"></span>
   <span style="color:${col};font-size:11px">${w>0?'+':''}${w}</span></div>`}
 let logs='';
 for(const [tm,lv,tag,msg] of s.logs){
  if(logFilter==='anom'&&lv!=='er')continue;
  if(logFilter==='warn'&&lv!=='wr')continue;
  logs+=`<div class="mono"><span class="mu">${tm}</span> <span class="${lv}">${tag.padEnd(7,' ')}</span> <span style="color:var(--dim)">${msg}</span></div>`}
 const chips=[['all','All'],['anom','Anomalies'],['warn','Warnings']].map(([id,lb])=>
  `<button class="chip ${logFilter===id?'on':''}" onclick="logFilter='${id}';render()">${lb}</button>`).join(' ');
 document.getElementById('app').innerHTML=`
 <div class="devhead">
  <div class="devicon" style="border-color:${c}"><i class="ti ${ICONS[k]}" style="color:${c}"></i></div>
  <div><div class="nm">${d.name}</div><div class="ip mono">${d.ip} · ${d.proto} · TON_IoT sensor</div></div>
  <div class="badge" style="color:${c};border-color:${c};background:${st==='alert'?'rgba(224,86,74,.08)':'transparent'}">● ${stText(st)}${st!=='stopped'?` — risk ${d.risk}`:''}</div>
 </div>
 <div class="notice ${s.stopped?'stop':''}" style="display:${s.stopped||s.manual?'block':'none'}">
  ${s.stopped?'<i class="ti ti-hand-off"></i> Device STOPPED — shut down and quarantined from the network by the Policy Engine.':'<i class="ti ti-device-remote"></i> Manual control active — device isolated, commands streamed from this console.'}
 </div>
 <div class="grid2">
  <div class="panel"><h3><i class="ti ti-hand-stop"></i> ACTIONS — POLICY ENGINE</h3>
   <div style="display:flex;gap:10px">
    <button class="btn ctl" onclick="act('${k}','ctl')">${s.manual?'Release control':'Take control'}</button>
    <button class="btn stp" onclick="act('${k}','stop')">${s.stopped?'Restart device':'STOP'}</button>
   </div>
   <div style="font-size:11px;color:var(--mut);margin-top:9px">Take control → isolate the device and stream commands manually. STOP → immediate shutdown and quarantine from the network.</div>
  </div>
  <div class="panel"><h3><i class="ti ti-message-circle"></i> EXPLAIN — WHY THIS VERDICT</h3>
   <div style="font-size:13px;color:#c9d6e6;line-height:1.6">${d.explain.text}</div>
   <div style="margin-top:10px">${feats}</div>
  </div>
 </div>
 <div class="cards" style="margin-top:12px">
  <div class="card"><div class="lbl">DEVICE STATE</div><div class="val" style="color:${c};font-size:18px">${stText(st)}</div></div>
  <div class="card"><div class="lbl">DEVICE RISK</div><div class="val" style="font-size:18px">${s.stopped?'—':d.risk}</div></div>
  <div class="card"><div class="lbl">TRUST WEIGHT</div><div class="val" style="font-size:18px;color:${d.trust<.7?'var(--amber)':'var(--txt)'}">${d.trust}${d.trust<.7?' ↓':''}</div></div>
  <div class="card"><div class="lbl">LAST TELEMETRY</div><div class="val ok" style="font-size:18px">${s.stopped?'—':'2s ago'}</div></div>
 </div>
 <div class="grid2">
  <div class="panel"><h3><i class="ti ${ICONS[k]}"></i> STATUS — TELEMETRY</h3><table>${telRows}</table>${spark}</div>
  <div class="panel"><h3><i class="ti ti-network"></i> NETWORK — RECENT CONNECTIONS</h3>
   <table><tr><th>dst</th><th>proto</th><th>state</th><th class="num">bytes</th><th class="num">verdict</th></tr>${netRows}</table>
   ${d.net.some(n=>n[4]!=='ok')?'<div style="font-size:11px;color:var(--amber);margin-top:8px"><i class="ti ti-alert-triangle"></i> flagged flows contributed to the Fusion Classifier verdict</div>':''}
  </div>
 </div>
 <div class="panel" style="margin-top:12px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
   <h3 style="margin:0"><i class="ti ti-list-details"></i> LOGS — FULL HISTORY</h3>
   <div>${chips}</div>
  </div>
  <div class="logbox">${logs||'<span class="mu">no entries for this filter</span>'}</div>
 </div>`;
}

function act(k,a){
 const s=S[k];
 if(a==='stop'){s.stopped=!s.stopped;s.manual=false;
  s.logs.unshift([now(),s.stopped?'er':'ok',s.stopped?'ACTION':'OK',s.stopped?'STOP issued from console — device shut down and quarantined':'device restarted — rejoining fleet']);
